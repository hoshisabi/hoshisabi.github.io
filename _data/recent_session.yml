excerpt: >-
  The last stop on the pub crawl should have been the easy one — Arcadia, blue
  skies, a spring festival. Instead the grown-ups have gone gray and quiet,
  modrons are measuring the streets straight, and in eight hours the whole town
  folds into Mechanus. Only the children still care.
