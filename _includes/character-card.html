<a href="{{ include.char.url }}" class="npc-card">
  {% if include.char.image %}<img src="{{ include.char.image }}" alt="{{ include.char.title }}">{% else %}<div class="npc-no-image"></div>{% endif %}
  <span>{{ include.char.title }}</span>
  {% if include.char.player %}<span class="card-player">{{ include.char.player }}</span>{% endif %}
</a>
